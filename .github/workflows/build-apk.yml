name: Build SIX separate THREE IB APKs and sources
on:
  push:
    branches: [main, codex/six-separate-apps-v4-20261107]
  pull_request:
  workflow_dispatch:

concurrency:
  group: three-ib-six-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  android:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      ANDROID_HOME: /usr/local/lib/android/sdk
      ANDROID_SDK_ROOT: /usr/local/lib/android/sdk
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - uses: actions/setup-go@v6
        with:
          go-version: '1.26.9'
          cache: false

      - name: Install Android SDK packages
        run: |
          set -euo pipefail
          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" "platforms;android-35" "build-tools;35.0.0" "ndk;28.0.13004108"

      - name: Build patched GoOmni ARM64 gateway for Rubika Independent
        shell: bash
        run: |
          set -euo pipefail
          rm -rf "$RUNNER_TEMP/goomni"
          git clone --depth 1 --branch v2.4.1 https://github.com/mimalef70/goomni.git "$RUNNER_TEMP/goomni"
          cd "$RUNNER_TEMP/goomni"
          python3 "$GITHUB_WORKSPACE/tools/patch-goomni-rubika-v6.py"
          cd src
          go mod download
          go mod verify
          mkdir -p "$GITHUB_WORKSPACE/app/src/main/jniLibs/arm64-v8a"
          NDK="$ANDROID_HOME/ndk/28.0.13004108"
          CC="$NDK/toolchains/llvm/prebuilt/linux-x86_64/bin/aarch64-linux-android26-clang"
          test -x "$CC"
          GOOS=android GOARCH=arm64 CGO_ENABLED=1 CC="$CC" go build -trimpath -ldflags="-s -w"             -o "$GITHUB_WORKSPACE/app/src/main/jniLibs/arm64-v8a/libgoomni.so" .
          test -s "$GITHUB_WORKSPACE/app/src/main/jniLibs/arm64-v8a/libgoomni.so"
          file "$GITHUB_WORKSPACE/app/src/main/jniLibs/arm64-v8a/libgoomni.so"

      - name: Read version
        shell: bash
        run: |
          python3 - <<'PY'
          import os, pathlib, re
          from datetime import datetime, timezone
          text = pathlib.Path("app/build.gradle.kts").read_text(encoding="utf-8")
          code = re.search(r"versionCode\s*=\s*(\d+)", text)
          name = re.search(r'versionName\s*=\s*"([^"]+)"', text)
          if not code or not name:
              raise SystemExit("Unable to read Android version")
          now = datetime.now(timezone.utc)
          with open(os.environ["GITHUB_ENV"], "a", encoding="utf-8") as f:
              f.write(f"VERSION_CODE={code.group(1)}\n")
              f.write(f"VERSION_NAME={name.group(1)}\n")
              f.write(f"BUILD_DATE={now:%Y-%m-%d}\n")
              f.write(f"BUILD_TIMESTAMP={now:%Y-%m-%dT%H:%M:%SZ}\n")
          PY

      - name: Verify two-column and legacy recipient imports
        run: bash tools/test-recipient-import.sh

      - name: Compile six independent APK flavors
        run: gradle :app:assembleDebug --no-daemon --stacktrace

      - name: Verify, name and package six APKs plus six source ZIPs
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p dist
          declare -A PKG
          PKG[bale]="com.sinicable.threeib.bale"
          PKG[rubika]="com.sinicable.threeib.rubika.independent"
          PKG[eitaa]="com.sinicable.threeib.eitaa"
          PKG[telegram]="com.sinicable.threeib.telegram"
          PKG[sms]="com.sinicable.threeib.sms.simple"
          PKG[whatsapp]="com.sinicable.threeib.whatsapp"

          for channel in bale rubika eitaa telegram sms whatsapp; do
            upper="$(echo "$channel" | tr '[:lower:]' '[:upper:]')"
            input="app/build/outputs/apk/$channel/debug/app-$channel-debug.apk"
            test -s "$input"
            apk="dist/THREE-IB-$upper-v$VERSION_NAME-$BUILD_DATE.apk"
            src="dist/THREE-IB-$upper-SOURCE-v$VERSION_NAME-$BUILD_DATE.zip"
            info="dist/BUILD-INFO-$upper.txt"
            cp "$input" "$apk"

            "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose --print-certs "$apk"
            badging="$("$ANDROID_HOME/build-tools/35.0.0/aapt2" dump badging "$apk")"
            actual="$(printf '%s\n' "$badging" | sed -n "s/^package: name='\([^']*\)'.*/\1/p" | head -1)"
            test "$actual" = "${PKG[$channel]}"

            # Independent launchability and least-privilege checks on every final APK.
            grep -Fq "versionName='$VERSION_NAME'" <<< "$badging"
            grep -Fq "launchable-activity: name='com.sinicable.messengerqueue.ChannelLauncherActivity'" <<< "$badging"
            grep -Fq "native-code: 'arm64-v8a'" <<< "$badging"
            if [[ "$channel" == "sms" ]]; then
              grep -Fq "uses-permission: name='android.permission.SEND_SMS'" <<< "$badging"
              grep -Fq "uses-permission: name='android.permission.READ_PHONE_STATE'" <<< "$badging"
            else
              ! grep -Fq "uses-permission: name='android.permission.SEND_SMS'" <<< "$badging"
              ! grep -Fq "uses-permission: name='android.permission.READ_PHONE_STATE'" <<< "$badging"
            fi
            manifest_tree="$("$ANDROID_HOME/build-tools/35.0.0/aapt2" dump xmltree --file AndroidManifest.xml "$apk")"
            if [[ "$channel" == "bale" || "$channel" == "rubika" || "$channel" == "eitaa" ]]; then
              grep -Fq "android:usesCleartextTraffic" <<< "$manifest_tree"
              unzip -Z1 "$apk" | grep -Fx 'lib/arm64-v8a/libgoomni.so' >/dev/null
            else
              ! grep -Fq "android:usesCleartextTraffic" <<< "$manifest_tree"
            fi

            {
              echo "THREE IB separate app v$VERSION_NAME"
              echo "Channel: $channel"
              echo "Package: $actual"
              echo "Version code: $VERSION_CODE"
              echo "Build timestamp UTC: $BUILD_TIMESTAMP"
              echo "Commit: $GITHUB_SHA"
              echo "Signing: GitHub Actions debug signature; not stable production signing."
              case "$channel" in
                rubika)
                  echo "Account mode: Rubika Independent personal login with phone + OTP + optional 2FA through a CI-rebuilt patched GoOmni v2.4.1 gateway."
                  echo "Discovery: current Rubika GET discovery first, legacy POST fallback; dedicated package/storage/port."\n                  echo "UI: Excel/CSV replaces queue, text, interval, CHECK READY, TEST ONE, START RUBIKA, STOP."
                  echo "No installed Rubika application is launched or screen-controlled."
                  echo "Provider implementation is unofficial and live account delivery is not asserted by this build."
                  ;;
                bale|eitaa)
                  echo "Account mode: phone + OTP + optional 2FA inside APK through bundled localhost GoOmni gateway."
                  echo "No installed messenger application is launched or screen-controlled."
                  echo "Provider implementation is unofficial and live account delivery is not asserted by this build."
                  ;;
                telegram)
                  echo "Account mode: official TDLib, API ID/API HASH stored encrypted, phone/OTP/2FA interactive login."
                  ;;
                sms)
                  echo "Mode: SMS Simple standalone package; Excel/CSV replaces queue, selected SIM SmsManager dispatch, text-only, SEND_SMS runtime permission."
                  ;;
                whatsapp)
                  echo "Mode: official WhatsApp Business Cloud API client queue."
                  echo "Requires authorized Meta Business backend HTTPS endpoint and runtime service token."
                  ;;
              esac
              echo "Recipient policy: per-row opt_in=true required; SMS additionally requires send_sms=true."
            } > "$info"

            git archive --format=zip --prefix="THREE-IB-$upper-v$VERSION_NAME-$BUILD_DATE/" HEAD -o "$src"
            task_suffix="${channel^}"
            printf 'TARGET_CHANNEL=%s\nAPPLICATION_ID=%s\nBUILD_TASK=:app:assemble%sDebug\n' "$channel" "$actual" "$task_suffix" > dist/TARGET_CHANNEL.txt
            zip -q -j "$src" dist/TARGET_CHANNEL.txt "$info"
          done

          rm -f dist/TARGET_CHANNEL.txt
          sha256sum dist/*.apk dist/*-SOURCE-*.zip > dist/SHA256SUMS.txt

      - name: Publish pull-request preview release
        if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository
        uses: softprops/action-gh-release@v2
        with:
          tag_name: THREE-IB-SIX-PR-${{ github.event.pull_request.number }}-${{ github.event.pull_request.head.sha }}
          name: THREE IB SIX SEPARATE APPS v${{ env.VERSION_NAME }} | DEBUG PREVIEW
          target_commitish: ${{ github.event.pull_request.head.sha }}
          draft: false
          prerelease: true
          fail_on_unmatched_files: true
          files: |
            dist/*.apk
            dist/*-SOURCE-*.zip
            dist/BUILD-INFO-*.txt
            dist/SHA256SUMS.txt
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Publish main-branch six-APK release
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: THREE-IB-SIX-v${{ env.VERSION_NAME }}-${{ env.BUILD_DATE }}-build${{ github.run_number }}
          name: THREE IB SIX APKs v${{ env.VERSION_NAME }} | ${{ env.BUILD_DATE }} | build ${{ github.run_number }}
          target_commitish: ${{ github.sha }}
          body: |
            Six independently installable ARM64 Android APK flavors and six source ZIPs.
            These APKs are debug-signed and CI build-verified, NOT production-signed.
            Live OTP/personal login, message delivery and end-to-end device behavior are unverified.
            WhatsApp Business requires an authorized HTTPS Cloud API backend.
            See BUILD-INFO files and SHA256SUMS before installation.
          draft: false
          prerelease: true
          fail_on_unmatched_files: true
          files: |
            dist/*.apk
            dist/*-SOURCE-*.zip
            dist/BUILD-INFO-*.txt
            dist/SHA256SUMS.txt
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload one transferable bundle for Google Drive
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          name: THREE-IB-SIX-SEPARATE-v${{ env.VERSION_NAME }}-${{ env.BUILD_DATE }}
          path: dist/*
          if-no-files-found: error
          retention-days: 7
