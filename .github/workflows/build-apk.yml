name: Build Messenger Queue Skip APK
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: android-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  android:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - name: Read app version
        shell: bash
        run: |
          python3 - <<'PY'
          import os
          import pathlib
          import re

          build = pathlib.Path("app/build.gradle.kts").read_text(encoding="utf-8")
          version_code = re.search(r"versionCode\s*=\s*(\d+)", build)
          version_name = re.search(r'versionName\s*=\s*"([^"]+)"', build)
          if not version_code or not version_name:
              raise SystemExit("Unable to read versionCode/versionName")
          with open(os.environ["GITHUB_ENV"], "a", encoding="utf-8") as env:
              env.write(f"VERSION_CODE={version_code.group(1)}\n")
              env.write(f"VERSION_NAME={version_name.group(1)}\n")
          PY
      - name: Test recipient consent parser
        run: bash tools/test-recipient-import.sh
      - name: Install Android SDK packages
        env:
          ANDROID_HOME: /usr/local/lib/android/sdk
          ANDROID_SDK_ROOT: /usr/local/lib/android/sdk
        run: |
          yes | /usr/local/lib/android/sdk/cmdline-tools/latest/bin/sdkmanager --licenses >/dev/null || true
          /usr/local/lib/android/sdk/cmdline-tools/latest/bin/sdkmanager "platforms;android-35" "build-tools;35.0.0"
      - name: Compile, package and sign APK with SDK tools
        shell: bash
        run: |
          set -euo pipefail
          ROOT="$PWD"
          SDK="/usr/local/lib/android/sdk"
          TOOLS="$SDK/build-tools/35.0.0"
          ANDROID_JAR="$SDK/platforms/android-35/android.jar"
          OUT="$RUNNER_TEMP/mqs"
          mkdir -p "$OUT/classes" "$OUT/dex" "$ROOT/app/build/outputs/apk/debug"
          python3 - "$OUT/AndroidManifest.xml" <<'PY'
          import os,pathlib,sys
          text=pathlib.Path("app/src/main/AndroidManifest.xml").read_text(encoding="utf-8")
          attrs=(f'<manifest package="com.sinicable.messengerqueue" '
                 f'android:versionCode="{os.environ["VERSION_CODE"]}" '
                 f'android:versionName="{os.environ["VERSION_NAME"]}" xmlns:android=')
          text=text.replace('<manifest xmlns:android=',attrs,1)
          pathlib.Path(sys.argv[1]).write_text(text,encoding="utf-8")
          PY
          "$TOOLS/aapt2" compile --dir app/src/main/res -o "$OUT/resources.zip"
          "$TOOLS/aapt2" link -o "$OUT/unsigned.apk" --manifest "$OUT/AndroidManifest.xml" -I "$ANDROID_JAR" --min-sdk-version 26 --target-sdk-version 35 "$OUT/resources.zip"
          find app/src/main/java -name '*.java' -print0 | xargs -0 javac -encoding UTF-8 -source 17 -target 17 -cp "$ANDROID_JAR" -d "$OUT/classes"
          find "$OUT/classes" -name '*.class' -print0 | xargs -0 "$TOOLS/d8" --lib "$ANDROID_JAR" --min-api 26 --output "$OUT/dex"
          python3 - "$OUT/unsigned.apk" "$OUT/dex/classes.dex" <<'PY'
          import zipfile,sys
          with zipfile.ZipFile(sys.argv[1],"a") as z:
              z.write(sys.argv[2],"classes.dex")
          PY
          "$TOOLS/zipalign" -f -p 4 "$OUT/unsigned.apk" "$OUT/aligned.apk"
          keytool -genkeypair -keystore "$OUT/debug.keystore" -alias androiddebugkey -storepass android -keypass android -dname "CN=Android Debug,O=Android,C=US" -keyalg RSA -keysize 2048 -validity 3650 -noprompt
          APK="$ROOT/app/build/outputs/apk/debug/MessengerQueueSkip-v${VERSION_NAME}.apk"
          "$TOOLS/apksigner" sign --ks "$OUT/debug.keystore" --ks-pass pass:android --key-pass pass:android --out "$APK" "$OUT/aligned.apk"
          "$TOOLS/apksigner" verify --verbose --print-certs "$APK"
          "$TOOLS/aapt2" dump badging "$APK" | head -20
      - uses: actions/upload-artifact@v4
        if: github.event_name != 'pull_request'
        with:
          name: MessengerQueueSkip-v${{ env.VERSION_NAME }}-APK
          path: app/build/outputs/apk/debug/MessengerQueueSkip-v${{ env.VERSION_NAME }}.apk
          if-no-files-found: error
          retention-days: 7
