name: Build THREE IB APK and source
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: three-ib-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  android:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      ANDROID_HOME: /usr/local/lib/android/sdk
      ANDROID_SDK_ROOT: /usr/local/lib/android/sdk
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Install Android SDK packages
        run: |
          set -euo pipefail
          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" "platforms;android-35" "build-tools;35.0.0"
      - name: Read app version and build date
        shell: bash
        run: |
          python3 - <<'PY'
          import os, pathlib, re
          from datetime import datetime, timezone
          text = pathlib.Path("app/build.gradle.kts").read_text(encoding="utf-8")
          code = re.search(r"versionCode\s*=\s*(\d+)", text)
          name = re.search(r'versionName\s*=\s*"([^"]+)"', text)
          if not code or not name:
              raise SystemExit("Unable to read Android version")
          now = datetime.now(timezone.utc)
          values = {
              "VERSION_CODE": code.group(1),
              "VERSION_NAME": name.group(1),
              "BUILD_DATE": now.strftime("%Y-%m-%d"),
              "BUILD_TIMESTAMP": now.strftime("%Y-%m-%dT%H:%M:%SZ"),
          }
          values["APK_NAME"] = f"THREE-IB-LATEST-{values['BUILD_DATE']}-v{values['VERSION_NAME']}.apk"
          values["SOURCE_ZIP_NAME"] = f"THREE-IB-SOURCE-LATEST-{values['BUILD_DATE']}-v{values['VERSION_NAME']}.zip"
          with open(os.environ["GITHUB_ENV"], "a", encoding="utf-8") as f:
              for k, v in values.items():
                  f.write(f"{k}={v}\n")
          PY
      - name: Compile and package installable APK
        run: gradle :app:assembleDebug --no-daemon --stacktrace
      - name: Verify APK signature and package metadata
        run: |
          set -euo pipefail
          APK="app/build/outputs/apk/debug/app-debug.apk"
          test -s "$APK"
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose --print-certs "$APK"
          "$ANDROID_HOME/build-tools/35.0.0/aapt2" dump badging "$APK" | head -20
      - name: Create dated source archive, report and checksums
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p dist
          APK="app/build/outputs/apk/debug/app-debug.apk"
          cp "$APK" "dist/$APK_NAME"
          INFO="dist/BUILD_INFO.txt"
          {
            echo "THREE IB build record"
            echo "Version: $VERSION_NAME (code $VERSION_CODE)"
            echo "Build date UTC: $BUILD_DATE"
            echo "Build timestamp UTC: $BUILD_TIMESTAMP"
            echo "Commit: $GITHUB_SHA"
            echo "Package: com.sinicable.messengerqueue"
            echo "Code included: Bale, Rubika, Eitaa, SMS SIM, Telegram TDLib, WhatsApp Business Cloud API adapter"
            echo "Telegram setup: API ID/API HASH entered in-app and encrypted with Android Keystore; login requires phone and any Telegram OTP/2FA prompts."
            echo "WhatsApp: shared opted-in Excel rows, persisted row statuses and manual resume; HTTPS and Meta credentials required."
            echo "Not implemented: background WhatsApp worker, Meta delivery webhook, WhatsApp templates."
            echo "Telegram queue: separate START/PAUSE screen; not part of the main four-channel START control."
            echo "Automated tests: NOT RUN (user instruction)"
            echo "Device/runtime/messenger/SIM/carrier tests: NOT PERFORMED (user instruction)"
            echo "Build checks: Gradle Java compile, APK packaging, signature verification, package metadata"
            echo "Signing: Gradle debug key generated for this runner; not a stable release signing identity."
            echo "SHA-256:"
            sha256sum "dist/$APK_NAME"
          } > "$INFO"
          git archive --format=zip --prefix="THREE-IB-v${VERSION_NAME}-${BUILD_DATE}/" HEAD -o "dist/$SOURCE_ZIP_NAME"
          zip -q -j "dist/$SOURCE_ZIP_NAME" "$INFO"
          sha256sum "dist/$APK_NAME" "dist/$SOURCE_ZIP_NAME" > dist/SHA256SUMS.txt
      - name: Publish dated GitHub Release
        if: github.event_name == 'push'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: THREE-IB-v${{ env.VERSION_NAME }}-${{ env.BUILD_DATE }}
          name: THREE IB v${{ env.VERSION_NAME }} | ${{ env.BUILD_DATE }}
          target_commitish: ${{ github.sha }}
          body_path: dist/BUILD_INFO.txt
          draft: false
          prerelease: true
          fail_on_unmatched_files: true
          files: |
            dist/${{ env.APK_NAME }}
            dist/${{ env.SOURCE_ZIP_NAME }}
            dist/SHA256SUMS.txt
            dist/BUILD_INFO.txt
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Publish stacked PR preview release (debug-signed, not production)
        if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository
        uses: softprops/action-gh-release@v2
        with:
          tag_name: THREE-IB-PR-${{ github.event.pull_request.number }}-${{ github.event.pull_request.head.sha }}
          name: THREE IB v${{ env.VERSION_NAME }} | PR #${{ github.event.pull_request.number }} | DEBUG PREVIEW
          target_commitish: ${{ github.event.pull_request.head.sha }}
          body_path: dist/BUILD_INFO.txt
          draft: false
          prerelease: true
          fail_on_unmatched_files: true
          files: |
            dist/${{ env.APK_NAME }}
            dist/${{ env.SOURCE_ZIP_NAME }}
            dist/SHA256SUMS.txt
            dist/BUILD_INFO.txt
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Upload dated build bundle (best effort; Actions storage may be full)
        if: github.event_name == 'push'
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          name: THREE-IB-LATEST-${{ env.BUILD_DATE }}-v${{ env.VERSION_NAME }}-BUNDLE
          path: dist/*
          if-no-files-found: error
          retention-days: 30
