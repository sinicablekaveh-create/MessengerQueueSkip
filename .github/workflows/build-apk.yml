name: Build THREE IB APK and source
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: three-ib-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  android:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - name: Read app version and build date
        shell: bash
        run: |
          python3 - <<'PY'
          import os
          import pathlib
          import re
          from datetime import datetime, timezone

          build = pathlib.Path("app/build.gradle.kts").read_text(encoding="utf-8")
          version_code = re.search(r"versionCode\s*=\s*(\d+)", build)
          version_name = re.search(r'versionName\s*=\s*"([^"]+)"', build)
          if not version_code or not version_name:
              raise SystemExit("Unable to read versionCode/versionName")
          now = datetime.now(timezone.utc)
          values = {
              "VERSION_CODE": version_code.group(1),
              "VERSION_NAME": version_name.group(1),
              "BUILD_DATE": now.strftime("%Y-%m-%d"),
              "BUILD_TIMESTAMP": now.strftime("%Y-%m-%dT%H:%M:%SZ"),
          }
          values["APK_NAME"] = f"THREE-IB-LATEST-{values['BUILD_DATE']}-v{values['VERSION_NAME']}.apk"
          values["SOURCE_ZIP_NAME"] = f"THREE-IB-SOURCE-LATEST-{values['BUILD_DATE']}-v{values['VERSION_NAME']}.zip"
          with open(os.environ["GITHUB_ENV"], "a", encoding="utf-8") as env:
              for key, value in values.items():
                  env.write(f"{key}={value}\n")
          PY
      - name: Install Android SDK packages
        env:
          ANDROID_HOME: /usr/local/lib/android/sdk
          ANDROID_SDK_ROOT: /usr/local/lib/android/sdk
        run: |
          yes | /usr/local/lib/android/sdk/cmdline-tools/latest/bin/sdkmanager --licenses >/dev/null || true
          /usr/local/lib/android/sdk/cmdline-tools/latest/bin/sdkmanager "platforms;android-35" "build-tools;35.0.0"
      - name: Compile, package and sign APK
        shell: bash
        run: |
          set -euo pipefail
          ROOT="$PWD"
          SDK="/usr/local/lib/android/sdk"
          TOOLS="$SDK/build-tools/35.0.0"
          ANDROID_JAR="$SDK/platforms/android-35/android.jar"
          OUT="$RUNNER_TEMP/mqs"
          mkdir -p "$OUT/classes" "$OUT/dex" "$ROOT/app/build/outputs/apk/debug"
          python3 - "$OUT/AndroidManifest.xml" <<'PY'
          import os,pathlib,sys
          text=pathlib.Path("app/src/main/AndroidManifest.xml").read_text(encoding="utf-8")
          attrs=(f'<manifest package="com.sinicable.messengerqueue" '
                 f'android:versionCode="{os.environ["VERSION_CODE"]}" '
                 f'android:versionName="{os.environ["VERSION_NAME"]}" xmlns:android=')
          text=text.replace('<manifest xmlns:android=',attrs,1)
          pathlib.Path(sys.argv[1]).write_text(text,encoding="utf-8")
          PY
          "$TOOLS/aapt2" compile --dir app/src/main/res -o "$OUT/resources.zip"
          "$TOOLS/aapt2" link -o "$OUT/unsigned.apk" --manifest "$OUT/AndroidManifest.xml" -I "$ANDROID_JAR" --min-sdk-version 26 --target-sdk-version 35 "$OUT/resources.zip"
          find app/src/main/java -name '*.java' -print0 | xargs -0 javac -encoding UTF-8 -source 17 -target 17 -cp "$ANDROID_JAR" -d "$OUT/classes"
          find "$OUT/classes" -name '*.class' -print0 | xargs -0 "$TOOLS/d8" --lib "$ANDROID_JAR" --min-api 26 --output "$OUT/dex"
          python3 - "$OUT/unsigned.apk" "$OUT/dex/classes.dex" <<'PY'
          import zipfile,sys
          with zipfile.ZipFile(sys.argv[1],"a") as z:
              z.write(sys.argv[2],"classes.dex")
          PY
          "$TOOLS/zipalign" -f -p 4 "$OUT/unsigned.apk" "$OUT/aligned.apk"
          keytool -genkeypair -keystore "$OUT/debug.keystore" -alias androiddebugkey -storepass android -keypass android -dname "CN=Android Debug,O=Android,C=US" -keyalg RSA -keysize 2048 -validity 3650 -noprompt
          APK="$ROOT/app/build/outputs/apk/debug/$APK_NAME"
          "$TOOLS/apksigner" sign --ks "$OUT/debug.keystore" --ks-pass pass:android --key-pass pass:android --out "$APK" "$OUT/aligned.apk"
          "$TOOLS/apksigner" verify --verbose --print-certs "$APK"
          "$TOOLS/aapt2" dump badging "$APK" | head -20
      - name: Create dated source archive and checksums
        shell: bash
        run: |
          set -euo pipefail
          APK="app/build/outputs/apk/debug/$APK_NAME"
          SOURCE_ZIP="$RUNNER_TEMP/$SOURCE_ZIP_NAME"
          INFO="$RUNNER_TEMP/BUILD_INFO.txt"
          {
            echo "THREE IB build record"
            echo "Version: $VERSION_NAME (code $VERSION_CODE)"
            echo "Build date UTC: $BUILD_DATE"
            echo "Build timestamp UTC: $BUILD_TIMESTAMP"
            echo "Commit: $GITHUB_SHA"
            echo "Ref: $GITHUB_REF"
            echo "Package: com.sinicable.messengerqueue"
            echo "Implemented: Bale, Rubika, Eitaa, SMS SIM"
            echo "Not implemented: Telegram TDLib, WhatsApp Business Cloud API"
            echo "Runtime and device tests: NOT PERFORMED (user instruction)"
            echo "Automated test suite: NOT RUN (user instruction)"
            echo "Build checks: Java compile, APK package, debug signature verification, package metadata"
            echo "Signing: temporary per-run debug key; not a stable release signing identity"
            echo "APK SHA-256:"
            sha256sum "$APK"
          } > "$INFO"
          git archive --format=zip --prefix="THREE-IB-v${VERSION_NAME}-${BUILD_DATE}/" HEAD -o "$SOURCE_ZIP"
          zip -q "$SOURCE_ZIP" "$INFO"
          sha256sum "$APK" "$SOURCE_ZIP" > SHA256SUMS.txt
      - uses: actions/upload-artifact@v4
        with:
          name: THREE-IB-LATEST-${{ env.BUILD_DATE }}-v${{ env.VERSION_NAME }}-APK
          path: app/build/outputs/apk/debug/${{ env.APK_NAME }}
          if-no-files-found: error
          retention-days: 30
      - uses: actions/upload-artifact@v4
        with:
          name: THREE-IB-SOURCE-LATEST-${{ env.BUILD_DATE }}-v${{ env.VERSION_NAME }}-ZIP
          path: ${{ runner.temp }}/${{ env.SOURCE_ZIP_NAME }}
          if-no-files-found: error
          retention-days: 30
      - uses: actions/upload-artifact@v4
        with:
          name: THREE-IB-SHA256-${{ env.BUILD_DATE }}-v${{ env.VERSION_NAME }}
          path: SHA256SUMS.txt
          if-no-files-found: error
          retention-days: 30
