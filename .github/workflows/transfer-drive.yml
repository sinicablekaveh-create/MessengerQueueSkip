name: Materialize THREE IB release assets for Drive transfer
on:
  push:
    branches: [transfer-drive-20261106-v291]
    paths:
      - .github/workflows/transfer-drive.yml

permissions:
  contents: write

jobs:
  materialize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: transfer-drive-20261106-v291
      - name: Download release assets into private transfer branch
        shell: bash
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          mkdir -p transfer
          fetch_asset() {
            id="$1"
            out="$2"
            curl -fL --retry 3 \
              -H "Authorization: Bearer $GITHUB_TOKEN" \
              -H "Accept: application/octet-stream" \
              -H "X-GitHub-Api-Version: 2022-11-28" \
              "https://api.github.com/repos/$GITHUB_REPOSITORY/releases/assets/$id" \
              -o "$out"
          }
          fetch_asset 717850665 transfer/THREE-IB-LATEST-2026-11-06-v2.9.1.apk
          fetch_asset 717850675 transfer/THREE-IB-SOURCE-LATEST-2026-11-06-v2.9.1.zip
          fetch_asset 717850671 transfer/SHA256SUMS.txt
          echo "dc960e7bc86122a0ccc1ff96906f0849c474cdb290d62ceec2f4abd4cb1bb1fc  transfer/THREE-IB-LATEST-2026-11-06-v2.9.1.apk" | sha256sum -c -
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add transfer
          git commit -m "chore: materialize v2.9.1 release assets for Drive transfer"
          git push origin HEAD:transfer-drive-20261106-v291
