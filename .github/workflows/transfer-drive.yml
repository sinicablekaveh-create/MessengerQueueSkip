name: Resolve THREE IB transfer URLs
on:
  push:
    branches: [transfer-drive-20261106-v291]
    paths:
      - .github/workflows/transfer-drive.yml

permissions:
  contents: write

jobs:
  resolve:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: transfer-drive-20261106-v291
      - name: Save short-lived signed release URLs
        shell: bash
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          mkdir -p transfer
          resolve() {
            id="$1"
            out="$2"
            curl -sS -L -o /dev/null -w '%{url_effective}' \
              -H "Authorization: Bearer $GITHUB_TOKEN" \
              -H "Accept: application/octet-stream" \
              -H "X-GitHub-Api-Version: 2022-11-28" \
              "https://api.github.com/repos/$GITHUB_REPOSITORY/releases/assets/$id" > "$out"
          }
          resolve 717850665 transfer/apk-url.txt
          resolve 717850675 transfer/source-url.txt
          resolve 717850671 transfer/sha-url.txt
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add transfer/*-url.txt
          git commit -m "chore: refresh short-lived Drive transfer URLs"
          git push origin HEAD:transfer-drive-20261106-v291
