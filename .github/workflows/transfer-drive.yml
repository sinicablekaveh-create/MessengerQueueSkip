name: Resolve THREE IB release transfer URLs
on:
  push:
    branches: [transfer-drive-20261106-v291]
    paths:
      - .github/workflows/transfer-drive.yml

permissions:
  contents: read

jobs:
  resolve:
    runs-on: ubuntu-latest
    steps:
      - name: Resolve short-lived signed download URLs
        shell: bash
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          for item in \
            "APK:717850665" \
            "SOURCE:717850675" \
            "SHA256:717850671"
          do
            name="${item%%:*}"
            id="${item##*:}"
            url="$(curl -sS -L -o /dev/null -w '%{url_effective}' \
              -H "Authorization: Bearer $GITHUB_TOKEN" \
              -H "Accept: application/octet-stream" \
              -H "X-GitHub-Api-Version: 2022-11-28" \
              "https://api.github.com/repos/$GITHUB_REPOSITORY/releases/assets/$id")"
            echo "TRANSFER_URL_${name}=${url}"
          done
