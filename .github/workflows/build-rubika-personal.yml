name: Build RUBIKA PERSONAL standalone
on:
  pull_request:
  workflow_dispatch:

concurrency:
  group: three-ib-rubika-personal-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  rubika:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      ANDROID_HOME: /usr/local/lib/android/sdk
      ANDROID_SDK_ROOT: /usr/local/lib/android/sdk
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - uses: actions/setup-go@v6
        with:
          go-version: '1.26.9'
          cache: false

      - name: Install Android SDK packages
        run: |
          set -euo pipefail
          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" "platforms;android-35" "build-tools;35.0.0" "ndk;28.0.13004108"

      - name: Build patched GoOmni ARM64 gateway
        shell: bash
        run: |
          set -euo pipefail
          rm -rf "$RUNNER_TEMP/goomni"
          git clone --depth 1 --branch v2.4.1 https://github.com/mimalef70/goomni.git "$RUNNER_TEMP/goomni"
          cd "$RUNNER_TEMP/goomni"
          python3 "$GITHUB_WORKSPACE/tools/patch-goomni-rubika-v6.py"
          gofmt -w src/internal/rubikameow/client.go src/infrastructure/mediafile/manager.go
          cd src
          go mod download
          go mod verify
          go test ./infrastructure/mediafile
          mkdir -p "$GITHUB_WORKSPACE/app/src/main/jniLibs/arm64-v8a"
          NDK="$ANDROID_HOME/ndk/28.0.13004108"
          CC="$NDK/toolchains/llvm/prebuilt/linux-x86_64/bin/aarch64-linux-android26-clang"
          GOOS=android GOARCH=arm64 CGO_ENABLED=1 CC="$CC" go build -trimpath -ldflags="-s -w" \
            -o "$GITHUB_WORKSPACE/app/src/main/jniLibs/arm64-v8a/libgoomni.so" .
          test -s "$GITHUB_WORKSPACE/app/src/main/jniLibs/arm64-v8a/libgoomni.so"

      - name: Read version
        shell: bash
        run: |
          python3 - <<'PY'
          import os, pathlib, re
          from datetime import datetime, timezone
          text = pathlib.Path("app/build.gradle.kts").read_text(encoding="utf-8")
          code = re.search(r"versionCode\s*=\s*(\d+)", text)
          name = re.search(r'versionName\s*=\s*"([^"]+)"', text)
          now = datetime.now(timezone.utc)
          with open(os.environ["GITHUB_ENV"], "a", encoding="utf-8") as f:
              f.write(f"VERSION_CODE={code.group(1)}\n")
              f.write(f"VERSION_NAME={name.group(1)}\n")
              f.write(f"BUILD_DATE={now:%Y-%m-%d}\n")
              f.write(f"BUILD_TIMESTAMP={now:%Y-%m-%dT%H:%M:%SZ}\n")
          PY

      - name: Verify recipient imports
        run: bash tools/test-recipient-import.sh

      - name: Compile Rubika APK only
        run: gradle :app:assembleRubikaDebug --no-daemon --stacktrace

      - name: Verify and package Rubika only
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p dist
          input="app/build/outputs/apk/rubika/debug/app-rubika-debug.apk"
          test -s "$input"
          apk="dist/THREE-IB-RUBIKA-PERSONAL-v$VERSION_NAME-$BUILD_DATE.apk"
          src="dist/THREE-IB-RUBIKA-PERSONAL-SOURCE-v$VERSION_NAME-$BUILD_DATE.zip"
          info="dist/BUILD-INFO-RUBIKA-PERSONAL.txt"
          cp "$input" "$apk"

          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose --print-certs "$apk"
          badging="$("$ANDROID_HOME/build-tools/35.0.0/aapt2" dump badging "$apk")"
          grep -Fq "package: name='com.sinicable.threeib.rubika.independent'" <<< "$badging"
          grep -Fq "versionName='$VERSION_NAME'" <<< "$badging"
          grep -Fq "launchable-activity: name='com.sinicable.messengerqueue.ChannelLauncherActivity'" <<< "$badging"
          grep -Fq "native-code: 'arm64-v8a'" <<< "$badging"
          ! grep -Fq "uses-permission: name='android.permission.SEND_SMS'" <<< "$badging"
          unzip -Z1 "$apk" | grep -Fx 'lib/arm64-v8a/libgoomni.so' >/dev/null

          {
            echo "THREE IB RUBIKA PERSONAL v$VERSION_NAME"
            echo "Package: com.sinicable.threeib.rubika.independent"
            echo "Version code: $VERSION_CODE"
            echo "Build timestamp UTC: $BUILD_TIMESTAMP"
            echo "Commit: $GITHUB_SHA"
            echo "Features: personal phone/OTP/optional 2FA login; Excel/CSV; text; JPG/PNG; 1-1440 minute interval; CHECK READY; TEST ONE; START; PAUSE/STOP; CLEAR PENDING."
            echo "Recipient routing: phone -> Rubika contacts.add/addAddressBook -> user_guid -> peer user/u0... -> send."
            echo "Signing: GitHub Actions debug signature; not stable production signing."
            echo "Rubika adapter is unofficial; build success does not prove live provider availability for every account."
          } > "$info"

          git archive --format=zip --prefix="THREE-IB-RUBIKA-PERSONAL-v$VERSION_NAME-$BUILD_DATE/" HEAD -o "$src"
          zip -q -j "$src" "$info"
          sha256sum "$apk" "$src" > dist/SHA256SUMS-RUBIKA-PERSONAL.txt

      - name: Publish Rubika preview release
        if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository
        uses: softprops/action-gh-release@v2
        with:
          tag_name: THREE-IB-RUBIKA-PR-${{ github.event.pull_request.number }}-${{ github.event.pull_request.head.sha }}
          name: THREE IB RUBIKA PERSONAL v${{ env.VERSION_NAME }} | DEBUG PREVIEW
          target_commitish: ${{ github.event.pull_request.head.sha }}
          draft: false
          prerelease: true
          fail_on_unmatched_files: true
          files: |
            dist/THREE-IB-RUBIKA-PERSONAL-*.apk
            dist/THREE-IB-RUBIKA-PERSONAL-SOURCE-*.zip
            dist/BUILD-INFO-RUBIKA-PERSONAL.txt
            dist/SHA256SUMS-RUBIKA-PERSONAL.txt
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload Rubika standalone artifact
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          name: THREE-IB-RUBIKA-PERSONAL-v${{ env.VERSION_NAME }}-${{ env.BUILD_DATE }}
          path: dist/*
          if-no-files-found: error
          retention-days: 7
