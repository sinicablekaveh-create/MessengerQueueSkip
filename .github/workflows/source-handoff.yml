name: Export THREE IB source ZIP
on:
  push:
    branches: [main]
    paths:
      - .github/workflows/source-handoff.yml
      - AGENTS.md
      - 'docs/**'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  source-archive:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Package tracked source files
        run: |
          git archive --format=zip --prefix=MessengerQueueSkip/ HEAD -o THREE-IB-MessengerQueueSkip-SOURCE.zip
          unzip -t THREE-IB-MessengerQueueSkip-SOURCE.zip >/dev/null
      - name: Verify source archive (six downloadable source ZIPs are published by build-apk.yml)
        run: |
          test -s THREE-IB-MessengerQueueSkip-SOURCE.zip
          unzip -t THREE-IB-MessengerQueueSkip-SOURCE.zip >/dev/null
          echo "Source archive verified. Build-apk.yml publishes the six channel source ZIPs to GitHub Releases."
        # Avoid actions/upload-artifact: this repository's Actions storage quota
        # currently rejects artifact uploads. The releases remain downloadable.
