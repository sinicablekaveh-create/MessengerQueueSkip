name: Build THREE IB APK

on:
  push:
    branches: [ "three-ib-apk-v1" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android platform and build tools
        run: yes | sdkmanager "platforms;android-36" "build-tools;36.0.0" >/dev/null

      - name: Gradle 9.6
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.6.0'

      - name: Build installable debug APK
        working-directory: android-app
        run: gradle :app:assembleDebug --stacktrace --no-daemon

      - name: Verify APK signature and manifest
        run: |
          APK="android-app/app/build/outputs/apk/debug/app-debug.apk"
          "$ANDROID_HOME/build-tools/36.0.0/apksigner" verify --verbose --print-certs "$APK"
          "$ANDROID_HOME/build-tools/36.0.0/aapt" dump badging "$APK" | head -20
          mkdir -p dist
          cp "$APK" dist/THREE_IB_v1.0.apk
          sha256sum dist/THREE_IB_v1.0.apk | tee dist/SHA256.txt

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: THREE_IB_APK
          path: |
            dist/THREE_IB_v1.0.apk
            dist/SHA256.txt
          if-no-files-found: error
          retention-days: 30
