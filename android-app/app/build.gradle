plugins {
    id 'com.android.application'
}

android {
    namespace 'com.threeib.queue'
    compileSdk 36

    defaultConfig {
        applicationId 'com.threeib.queue'
        minSdk 26
        targetSdk 35
        versionCode 10
        versionName '1.0'
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    buildTypes {
        debug {
            debuggable true
        }
        release {
            minifyEnabled false
        }
    }
}
